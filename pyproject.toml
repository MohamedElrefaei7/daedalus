[project]
name = "daedalus"
version = "0.1.0"
description = "Personal knowledge-graph and agent system built on Obsidian."
requires-python = ">=3.11"
dependencies = [
    "fastmcp==4.2.6",
    "keyring>=25.7.0",
    "openai>=3.59.0",
    "prompt-toolkit>=3.0.53",
    "pyyaml",
    "rich>=15.0.0",
    "tomlkit>=0.15.3",
]

[project.scripts]
daedalus = "daedalus.terminal.repl:main"
daedalus-mcp = "daedalus.mcp_server:main"

[project.optional-dependencies]
dev = ["pytest"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/daedalus"]

[tool.pytest.ini_options]
testpaths = ["tests"]
