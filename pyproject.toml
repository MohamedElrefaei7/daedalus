[project]
name = "daedalus"
version = "0.1.0"
description = "Personal knowledge-graph and agent system built on Obsidian."
requires-python = ">=3.11"
dependencies = [
    "fastmcp==4.2.6",
    "pyyaml",
]

[project.scripts]
daedalus-mcp = "daedalus.mcp_server:main"

[project.optional-dependencies]
dev = ["pytest"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/daedalus"]

[tool.pytest.ini_options]
testpaths = ["tests"]
